<title>Confirmação de Presença</title>

<style>
  
.folhagem-topo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:260px;
    background-image:url('folhagem.webp');
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    z-index:0;

    animation: vento 6s ease-in-out infinite;
}

@keyframes vento{
    0%{
        transform:translateY(0px) rotate(0deg);
    }

    25%{
        transform:translateY(3px) rotate(0.5deg);
    }

    50%{
        transform:translateY(0px) rotate(0deg);
    }

    75%{
        transform:translateY(-3px) rotate(-0.5deg);
    }

    100%{
        transform:translateY(0px) rotate(0deg);
    }
}

.container{
    position:relative;
    z-index:2;
}
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
    font-family: 'Georgia', serif;
    background: #ffffff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    overflow:hidden;
    position:relative;
}

/* FUNDO */

body::before{
content:'';
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.18)),
url('folhagem.webp');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
z-index:-3;
}

/* FOLHAGEM SUPERIOR */

.top-folhas{
position:absolute;
top:0;
left:0;
width:100%;
height:220px;
background:url('https://i.imgur.com/L0x7XK5.png');
background-size:cover;
background-position:top center;
animation:balanco 6s ease-in-out infinite alternate;
z-index:-1;
}

/* FOLHAGEM INFERIOR */

.bottom-folhas{
position:absolute;
bottom:0;
left:0;
width:100%;
height:220px;
background:url('https://i.imgur.com/u6rlG8x.png');
background-size:cover;
background-position:bottom center;
animation:balanco 7s ease-in-out infinite alternate;
z-index:-1;
}

/* ANIMAÇÃO SUAVE */

@keyframes balanco{
0%{
transform:translateY(0px) rotate(0deg);
}
100%{
transform:translateY(5px) rotate(1deg);
}
}

/* FOLHAS CAINDO */

.folha{
position:absolute;
top:-50px;
font-size:30px;
animation:cair linear infinite;
opacity:0.7;
}

@keyframes cair{
0%{
transform:translateY(-100px) rotate(0deg);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(120vh) rotate(360deg);
opacity:0;
}
}

/* CARD */

.container{
background:rgba(255,255,255,0.88);
width:90%;
max-width:500px;
padding:50px 35px;
border-radius:30px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
backdrop-filter:blur(10px);
border:2px solid rgba(179,137,74,0.4);
position:relative;
z-index:5;
}

/* TITULOS */

h1{
font-size:62px;
color:#b3894a;
margin-bottom:10px;
font-weight:normal;
}

h2{
font-size:42px;
color:#204d2f;
margin-bottom:30px;
font-weight:normal;
}

p{
font-size:22px;
color:#333;
margin-bottom:35px;
line-height:1.5;
}

/* INPUT */

input{
width:100%;
padding:20px;
border-radius:18px;
border:2px solid #d7d7d7;
font-size:20px;
outline:none;
margin-bottom:25px;
transition:0.3s;
}

input:focus{
border-color:#2f6b3b;
box-shadow:0 0 10px rgba(47,107,59,0.3);
}

/* BOTÃO */

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#1f5d2f,#3f8d4f);
color:white;
font-size:24px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

button:hover{
transform:scale(1.02);
}

/* RESULTADO */

#resultado{
margin-top:30px;
font-size:22px;
font-weight:bold;
}

/* RESPONSIVO */

@media(max-width:600px){

h1{
font-size:45px;
}

h2{
font-size:30px;
}

p{
font-size:18px;
}

.container{
padding:40px 25px;
}

}

</style>

/* REMOVER ACENTOS */

function normalizar(texto){

return texto
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/\*/g,"")
.trim();

}

/* VERIFICAR */

function verificarConvite(){

const nomeDigitado =
normalizar(document.getElementById("nome").value);

const convidadosNormalizados =
convidados.map(nome => normalizar(nome));

const resultado =
document.getElementById("resultado");

if(convidadosNormalizados.includes(nomeDigitado)){

resultado.style.color = "#2f6b3b";

resultado.innerHTML =
"✅ Convite encontrado! Será um prazer ter você conosco.";

}else{

resultado.style.color = "#b00020";

resultado.innerHTML =
"❌ Seu nome não foi localizado na lista de convidados.";
