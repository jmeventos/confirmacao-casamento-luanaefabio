<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Presença | Luana & Fábio</title>

  <style>
  .report-actions {
  display: grid;
 grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}

.report-btn {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 13px 16px;
  background: #31563a;
  color: #ffffff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.report-btn:hover {
  background: #24432c;
}

.whatsapp-btn {
  background: #218b4e;
}

.whatsapp-btn:hover {
  background: #176c3a;
}

@media (min-width: 600px) {
  .report-actions {
    grid-template-columns: repeat(3, 1fr);
  }
} 
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
  min-height: 100vh;
  background:
    linear-gradient(rgba(230, 245, 235, 0.70), rgba(230, 245, 235, 0.70)),
    url("folhagem.webp") center/cover no-repeat fixed;
  color: #2f2927;
  padding: 22px 14px;
}

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 24px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.65);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: #2f2927;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.05;
      font-weight: 800;
    }

    .subtitle {
      font-size: 15px;
      color: #6d625d;
      margin-top: 4px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #e6ddd8;
      border-radius: 17px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      color: #2f2927;
    }

    .tabs {
      display: flex;
      gap: 9px;
      margin-bottom: 18px;
      overflow-x: auto;
      padding-bottom: 3px;
    }

    .tab {
      border: none;
      border-radius: 14px;
      padding: 10px 17px;
      font-size: 15px;
      font-weight: 700;
      color: #2f2927;
      background: rgba(238,231,226,0.9);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: #2f2927;
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat {
      background: rgba(255,255,255,0.82);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid rgba(230,221,216,0.8);
    }

    .stat strong {
      display: block;
      font-size: 20px;
    }

    .stat span {
      font-size: 12px;
      color: #6d625d;
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background: rgba(255,255,255,0.9);
      border-radius: 20px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid rgba(230,221,216,0.8);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .guest-name {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .guest-status {
      font-size: 14px;
      color: #4f8f55;
      font-weight: 600;
    }

    .guest-time {
      font-size: 12px;
      color: #7a706b;
      margin-top: 3px;
    }

    .present-btn {
      border: none;
      border-radius: 10px;
      background: #4f9b57;
      color: #fff;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(79,155,87,0.25);
    }

    .present-btn.off {
      background: #c7beb8;
      box-shadow: none;
    }

    .empty {
      text-align: center;
      padding: 26px 10px;
      color: #6d625d;
      font-size: 15px;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #7a706b;
    }
.report-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.report-modal.open{
    display:flex;
}

.report-modal-content{
    background:#fff;
    width:100%;
    max-width:700px;
    border-radius:18px;
    padding:24px;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.close-report-modal{
    position:absolute;
    top:15px;
    right:18px;
    font-size:28px;
    cursor:pointer;
    font-weight:bold;
}

.report-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.report-option{
    padding:14px;
    border:2px solid #31563a;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
}

.report-option:hover{
    background:#31563a;
    color:#fff;
}
.report-modal-content h2{
    text-align:center;
    color:#31563a;
    font-size:26px;
    margin-bottom:8px;
}

.modal-description{
    text-align:center;
    color:#6d625d;
    font-size:15px;
    margin-bottom:20px;
}

.report-summary{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

.summary-card{
    background:#f3f7f4;
    border:1px solid #dce8df;
    border-radius:14px;
    padding:14px 8px;
    text-align:center;
}

.summary-card strong{
    display:block;
    font-size:24px;
    color:#31563a;
    margin-bottom:3px;
}

.summary-card span{
    font-size:12px;
    color:#6d625d;
}

.report-options{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.report-option-btn{
    width:100%;
    border:none;
    border-radius:13px;
    padding:14px;
    background:#31563a;
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.report-option-btn:hover{
    background:#24432c;
}

@media (min-width:600px){
    .report-options{
        grid-template-columns:repeat(2,1fr);
    }
}
    
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="icon">👥</div>
      <div>
        <h1>Painel de Presença</h1>
        <p class="subtitle">Controle de entrada</p>
      </div>
    </section>

    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Buscar convidado..." />
    </div>

    <div class="tabs">
      <button class="tab active" data-filter="todos">Todos</button>
      <button class="tab" data-filter="confirmados">Confirmados</button>
      <button class="tab" data-filter="presentes">Presentes</button>
      <button class="tab" data-filter="pendentes">Pendentes</button>
    </div>
<div class="report-actions">
 
  <button id="reportBtn" class="report-btn">
    📊 Relatório em PDF
</button>

  <button id="shareWhatsappBtn" class="report-btn whatsapp-btn">
    📱 Compartilhar no WhatsApp
  </button>
</div>
<div class="stats">
      <div class="stat"><strong id="totalCount">0</strong><span>Total</span></div>
      <div class="stat"><strong id="confirmedCount">0</strong><span>Confirmados</span></div>
      <div class="stat"><strong id="presentCount">0</strong><span>Presentes</span></div>
    </div>

    <section id="guestList" class="guest-list"></section>

    <p class="footer-note">Luana & Fábio • RSVP digital</p>
  </main>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // COLE AQUI A MESMA CONFIGURAÇÃO FIREBASE DA SUA PÁGINA RSVP
   const firebaseConfig = {
  apiKey: "AIzaSyDY3OJ_rgq0duVD0lOIs0wiIt5JAB0_Keg",
  authDomain: "casamento-luana-e-fabio.firebaseapp.com",
  projectId: "casamento-luana-e-fabio",
  storageBucket: "casamento-luana-e-fabio.firebasestorage.app",
  messagingSenderId: "166534956996",
  appId: "1:166534956996:web:bdb486e0e1a9cb5a544691"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ALTERE AQUI SOMENTE SE SUA COLEÇÃO TIVER OUTRO NOME
    const convidadosRef = collection(db, "confirmacoes");

    let convidados = [];
    let filtroAtual = "todos";

    const guestList = document.getElementById("guestList");
    const searchInput = document.getElementById("searchInput");
    const tabs = document.querySelectorAll(".tab");
    const reportBtn = document.getElementById("reportBtn");
const shareWhatsappBtn = document.getElementById("shareWhatsappBtn");
    const reportModal = document.getElementById("reportModal");
const closeReportModal = document.getElementById("closeReportModal");

const reportOptionButtons = document.querySelectorAll(".report-option-btn");

function obterResumo() {
  const confirmados = convidados.filter(c => c.status === "confirmado");
  const presentes = confirmados.filter(c => c.presente === true);
  const ausentes = confirmados.filter(c => c.presente !== true);
  const taxa = confirmados.length
    ? Math.round((presentes.length / confirmados.length) * 100)
    : 0;
  return { confirmados, presentes, ausentes, taxa };
}

function abrirModalRelatorio() {
  const { confirmados, presentes, ausentes, taxa } = obterResumo();

  document.getElementById("modalConfirmedCount").textContent = confirmados.length;
  document.getElementById("modalPresentCount").textContent = presentes.length;
  document.getElementById("modalAbsentCount").textContent = ausentes.length;
  document.getElementById("modalAttendanceRate").textContent = `${taxa}%`;

  reportModal.classList.add("open");
  reportModal.setAttribute("aria-hidden", "false");
}

function fecharModalRelatorio() {
  reportModal.classList.remove("open");
  reportModal.setAttribute("aria-hidden", "true");
}

reportBtn.addEventListener("click", abrirModalRelatorio);
closeReportModal.addEventListener("click", fecharModalRelatorio);

reportModal.addEventListener("click", (event) => {
  if (event.target === reportModal) fecharModalRelatorio();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") fecharModalRelatorio();
});

reportOptionButtons.forEach(button => {
  button.addEventListener("click", () => gerarRelatorio(button.dataset.reportType));
});

shareWhatsappBtn.addEventListener("click", compartilharResumoWhatsApp);

    onSnapshot(convidadosRef, (snapshot) => {
      convidados = snapshot.docs.map((documento) => ({
  id: documento.id,
  nome: documento.data().nome,
  status: documento.data().status,
  dataHora: documento.data().dataHora,
  presente: documento.data().presente || false,
  horarioPresenca: documento.data().horarioPresenca || null
}));
      render();
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        filtroAtual = tab.dataset.filter;
        render();
      });
    });

    searchInput.addEventListener("input", render);

    function render() {
      const termo = searchInput.value.toLowerCase().trim();

      const filtrados = convidados.filter((convidado) => {
        const nome = (convidado.nome || "").toLowerCase();
        const confirmado = convidado.status === "confirmado";
        const presente = Boolean(convidado.presente);

        const bateBusca = nome.includes(termo);
        const bateFiltro =
          filtroAtual === "todos" ||
          (filtroAtual === "confirmados" && confirmado) ||
          (filtroAtual === "presentes" && presente) ||
          (filtroAtual === "pendentes" && !confirmado);

        return bateBusca && bateFiltro;
      });

      document.getElementById("totalCount").textContent = convidados.length;
      document.getElementById("confirmedCount").textContent =
 convidados.filter(c => c.status === "confirmado").length;
      document.getElementById("presentCount").textContent = convidados.filter(c => c.presente || c.present).length;

      if (filtrados.length === 0) {
        guestList.innerHTML = `<div class="empty">Nenhum convidado encontrado.</div>`;
        return;
      }

      guestList.innerHTML = filtrados
        .sort((a, b) => (a.nome || a.name || "").localeCompare(b.nome || b.name || ""))
        .map((convidado) => {
          const nome = convidado.nome || "Convidado sem nome";
          const confirmado = convidado.status === "confirmado";
          const presente = Boolean(convidado.presente || convidado.present);
          const horario = formatarHorario(convidado.horarioPresenca || convidado.presentAt);

          return `
            <article class="guest-card">
              <div>
                <div class="guest-name">${escapeHtml(nome)}</div>
                <div class="guest-status">${confirmado ? "Confirmado" : "Pendente de confirmação"}</div>
                ${presente ? `<div class="guest-time">Entrada registrada ${horario}</div>` : ""}
              </div>
              <button class="present-btn ${presente ? "off" : ""}" onclick="marcarPresenca('${convidado.id}', ${presente})">
                ${presente ? "PRESENTE ✓" : "MARCAR"}
              </button>
            </article>
          `;
        })
        .join("");
    }

    window.marcarPresenca = async function(id, jaPresente) {
     const convidadoDoc = doc(db, "confirmacoes", id);
      await updateDoc(convidadoDoc, {
        presente: !jaPresente,
        horarioPresenca: !jaPresente ? serverTimestamp() : null
      });
    };

    function formatarHorario(timestamp) {
      if (!timestamp) return "";
      const data = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return `às ${data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
    }


    function dataPresencaParaOrdenacao(convidado) {
      const timestamp = convidado.horarioPresenca;
      if (!timestamp) return Number.MAX_SAFE_INTEGER;
      const data = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return data.getTime();
    }

    function obterListaRelatorio(tipo) {
      const { confirmados, presentes, ausentes } = obterResumo();

      if (tipo === "confirmados") {
        return {
          titulo: "Lista de Confirmados",
          itens: confirmados.slice().sort((a,b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"))
        };
      }

      if (tipo === "presentes") {
        return {
          titulo: "Lista de Presentes — Ordem de Chegada",
          itens: presentes.slice().sort((a,b) =>
            dataPresencaParaOrdenacao(a) - dataPresencaParaOrdenacao(b)
          )
        };
      }

      if (tipo === "ausentes") {
        return {
          titulo: "Lista de Ausentes",
          itens: ausentes.slice().sort((a,b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"))
        };
      }

      return {
        titulo: "Relatório Completo de Convidados",
        itens: convidados.slice().sort((a,b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"))
      };
    }

    function gerarRelatorio(tipo) {
      const { confirmados, presentes, ausentes, taxa } = obterResumo();
      const { titulo, itens } = obterListaRelatorio(tipo);
      const emissao = new Date().toLocaleString("pt-BR");

      const linhas = itens.map((convidado, indice) => {
        const horario = convidado.presente ? formatarHorario(convidado.horarioPresenca) : "—";
        return `
          <tr>
            <td>${indice + 1}</td>
            <td>${escapeHtml(convidado.nome || "Convidado sem nome")}</td>
            <td>${convidado.status === "confirmado" ? "Confirmado" : "Pendente"}</td>
            <td>${convidado.presente ? "Presente" : "Ausente"}</td>
            <td>${horario}</td>
          </tr>
        `;
      }).join("");

      const janela = window.open("", "_blank", "width=1000,height=800");
      if (!janela) {
        alert("Permita pop-ups no navegador e tente novamente.");
        return;
      }

      janela.document.write(`
        <!DOCTYPE html>
        <html lang="pt-BR">
        <head>
          <meta charset="UTF-8">
          <title>${REPORT_CODE} — ${titulo}</title>
          <style>
            *{box-sizing:border-box}
            body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;padding:28px}
            .header{border-bottom:3px solid #31563a;padding-bottom:16px;margin-bottom:18px}
            .brand{font-size:25px;font-weight:800;color:#31563a}
            .system{font-size:13px;color:#666;margin-top:3px}
            h1{font-size:22px;margin:18px 0 6px}
            .meta{font-size:13px;line-height:1.6;color:#444}
            .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
            .card{border:1px solid #d8e4da;background:#f3f7f4;border-radius:10px;padding:12px;text-align:center}
            .card strong{display:block;font-size:21px;color:#31563a}
            .card span{font-size:11px;color:#666}
            table{width:100%;border-collapse:collapse;font-size:12px}
            th,td{border:1px solid #ddd;padding:8px;text-align:left}
            th{background:#31563a;color:#fff}
            tr:nth-child(even){background:#f7f7f7}
            .footer{margin-top:24px;padding-top:12px;border-top:1px solid #ccc;text-align:center;font-size:11px;color:#666}
            @media print{
              body{padding:12mm}
              thead{display:table-header-group}
              tr{page-break-inside:avoid}
            }
          </style>
        </head>
        <body>
          <section class="header">
            <div class="brand">${COMPANY_NAME}</div>
            <div class="system">Sistema inteligente de controle de presença</div>
            <h1>${titulo}</h1>
            <div class="meta">
              <strong>Evento:</strong> ${EVENT_NAME}<br>
              <strong>Data do evento:</strong> ${EVENT_DATE}<br>
              <strong>Relatório nº:</strong> ${REPORT_CODE}<br>
              <strong>Emissão:</strong> ${emissao}
            </div>
          </section>

          <section class="summary">
            <div class="card"><strong>${convidados.length}</strong><span>Total</span></div>
            <div class="card"><strong>${confirmados.length}</strong><span>Confirmados</span></div>
            <div class="card"><strong>${presentes.length}</strong><span>Presentes</span></div>
            <div class="card"><strong>${ausentes.length}</strong><span>Ausentes — ${taxa}% comparecimento</span></div>
          </section>

          <table>
            <thead>
              <tr>
                <th>Nº</th>
                <th>Nome</th>
                <th>Confirmação</th>
                <th>Presença</th>
                <th>Horário</th>
              </tr>
            </thead>
            <tbody>${linhas}</tbody>
          </table>

          <div class="footer">
            ${COMPANY_NAME} • Relatório ${REPORT_CODE}<br>
            WhatsApp: ${COMPANY_PHONE} • © 2026 Todos os direitos reservados.
          </div>

          <script>
            window.onload = () => setTimeout(() => window.print(), 400);
          <\/script>
        </body>
        </html>
      `);

      janela.document.close();
      fecharModalRelatorio();
    }

    function compartilharResumoWhatsApp() {
      const { confirmados, presentes, ausentes, taxa } = obterResumo();

      const mensagem =
`📊 *RELATÓRIO DE PRESENÇA*
*${EVENT_NAME}*
Data: ${EVENT_DATE}

Total cadastrado: ${convidados.length}
Confirmados: ${confirmados.length}
Presentes: ${presentes.length}
Ausentes: ${ausentes.length}
Comparecimento: ${taxa}%

Relatório: ${REPORT_CODE}
Gerado por ${COMPANY_NAME}
Contato: ${COMPANY_PHONE}`;

      window.open(`https://wa.me/?text=${encodeURIComponent(mensagem)}`, "_blank");
    }

    function escapeHtml(texto) {
      return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
