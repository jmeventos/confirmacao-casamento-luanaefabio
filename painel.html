<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Presença | Luana & Fábio</title>

  <style>
  .report-actions {
  display: grid;
 grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}

.report-btn {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 13px 16px;
  background: #31563a;
  color: #ffffff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.report-btn:hover {
  background: #24432c;
}

.whatsapp-btn {
  background: #218b4e;
}

.whatsapp-btn:hover {
  background: #176c3a;
}

@media (min-width: 600px) {
  .report-actions {
    grid-template-columns: repeat(3, 1fr);
  }
} 
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
  min-height: 100vh;
  background:
    linear-gradient(rgba(230, 245, 235, 0.70), rgba(230, 245, 235, 0.70)),
    url("folhagem.webp") center/cover no-repeat fixed;
  color: #2f2927;
  padding: 22px 14px;
}

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 24px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.65);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: #2f2927;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.05;
      font-weight: 800;
    }

    .subtitle {
      font-size: 15px;
      color: #6d625d;
      margin-top: 4px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #e6ddd8;
      border-radius: 17px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      color: #2f2927;
    }

    .tabs {
      display: flex;
      gap: 9px;
      margin-bottom: 18px;
      overflow-x: auto;
      padding-bottom: 3px;
    }

    .tab {
      border: none;
      border-radius: 14px;
      padding: 10px 17px;
      font-size: 15px;
      font-weight: 700;
      color: #2f2927;
      background: rgba(238,231,226,0.9);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: #2f2927;
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat {
      background: rgba(255,255,255,0.82);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid rgba(230,221,216,0.8);
    }

    .stat strong {
      display: block;
      font-size: 20px;
    }

    .stat span {
      font-size: 12px;
      color: #6d625d;
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background: rgba(255,255,255,0.9);
      border-radius: 20px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid rgba(230,221,216,0.8);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .guest-name {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .guest-status {
      font-size: 14px;
      color: #4f8f55;
      font-weight: 600;
    }

    .guest-time {
      font-size: 12px;
      color: #7a706b;
      margin-top: 3px;
    }

    .present-btn {
      border: none;
      border-radius: 10px;
      background: #4f9b57;
      color: #fff;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(79,155,87,0.25);
    }

    .present-btn.off {
      background: #c7beb8;
      box-shadow: none;
    }

    .empty {
      text-align: center;
      padding: 26px 10px;
      color: #6d625d;
      font-size: 15px;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #7a706b;
    }
.report-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.report-modal.open{
    display:flex;
}

.report-modal-content{
    background:#fff;
    width:100%;
    max-width:700px;
    border-radius:18px;
    padding:24px;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.close-report-modal{
    position:absolute;
    top:15px;
    right:18px;
    font-size:28px;
    cursor:pointer;
    font-weight:bold;
}

.report-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.report-option{
    padding:14px;
    border:2px solid #31563a;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
}

.report-option:hover{
    background:#31563a;
    color:#fff;
}
.report-modal-content h2{
    text-align:center;
    color:#31563a;
    font-size:26px;
    margin-bottom:8px;
}

.modal-description{
    text-align:center;
    color:#6d625d;
    font-size:15px;
    margin-bottom:20px;
}

.report-summary{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

.summary-card{
    background:#f3f7f4;
    border:1px solid #dce8df;
    border-radius:14px;
    padding:14px 8px;
    text-align:center;
}

.summary-card strong{
    display:block;
    font-size:24px;
    color:#31563a;
    margin-bottom:3px;
}

.summary-card span{
    font-size:12px;
    color:#6d625d;
}

.report-options{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.report-option-btn{
    width:100%;
    border:none;
    border-radius:13px;
    padding:14px;
    background:#31563a;
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.report-option-btn:hover{
    background:#24432c;
}

@media (min-width:600px){
    .report-options{
        grid-template-columns:repeat(2,1fr);
    }
}
    
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="icon">👥</div>
      <div>
        <h1>Painel de Presença</h1>
        <p class="subtitle">Controle de entrada</p>
      </div>
    </section>

    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Buscar convidado..." />
    </div>

    <div class="tabs">
      <button class="tab active" data-filter="todos">Todos</button>
      <button class="tab" data-filter="confirmados">Confirmados</button>
      <button class="tab" data-filter="presentes">Presentes</button>
      <button class="tab" data-filter="pendentes">Pendentes</button>
    </div>
<div class="report-actions">
 
  <button id="reportBtn" class="report-btn">
    📊 Relatório em PDF
</button>

  <button id="shareWhatsappBtn" class="report-btn whatsapp-btn">
    📱 Compartilhar no WhatsApp
  </button>
</div>
    <div id="reportModal" class="report-modal">

  <div class="report-modal-content">

    <button id="closeReportModal" class="close-report-modal">
      ×
    </button>

    <h2>Relatório do Evento</h2>

    <p class="modal-description">
      Escolha a lista que deseja gerar em PDF:
    </p>

    <div class="report-summary">

      <div class="summary-card">
        <strong id="modalConfirmedCount">0</strong>
        <span>Confirmados</span>
      </div>

      <div class="summary-card">
        <strong id="modalPresentCount">0</strong>
        <span>Presentes</span>
      </div>

      <div class="summary-card">
        <strong id="modalAbsentCount">0</strong>
        <span>Ausentes</span>
      </div>

      <div class="summary-card">
        <strong id="modalAttendanceRate">0%</strong>
        <span>Comparecimento</span>
      </div>

    </div>

    <div class="report-options">

      <button class="report-option-btn" data-report-type="confirmados">
        ✅ Confirmados
      </button>

      <button class="report-option-btn" data-report-type="presentes">
        🟢 Presentes
      </button>

      <button class="report-option-btn" data-report-type="ausentes">
        🔴 Ausentes
      </button>

      <button class="report-option-btn" data-report-type="todos">
        👥 Relatório completo
      </button>

    </div>

  </div>

</div>
    <div class="stats">
      <div class="stat"><strong id="totalCount">0</strong><span>Total</span></div>
      <div class="stat"><strong id="confirmedCount">0</strong><span>Confirmados</span></div>
      <div class="stat"><strong id="presentCount">0</strong><span>Presentes</span></div>
    </div>

    <section id="guestList" class="guest-list"></section>

    <p class="footer-note">Luana & Fábio • RSVP digital</p>
  </main>
  
  <div id="reportModal" class="report-modal">

   <div class="report-modal-content">

        ...
        TODO O CONTEÚDO
        ...

    </div>

</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // COLE AQUI A MESMA CONFIGURAÇÃO FIREBASE DA SUA PÁGINA RSVP
   const firebaseConfig = {
  apiKey: "AIzaSyDY3OJ_rgq0duVD0lOIs0wiIt5JAB0_Keg",
  authDomain: "casamento-luana-e-fabio.firebaseapp.com",
  projectId: "casamento-luana-e-fabio",
  storageBucket: "casamento-luana-e-fabio.firebasestorage.app",
  messagingSenderId: "166534956996",
  appId: "1:166534956996:web:bdb486e0e1a9cb5a544691"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ALTERE AQUI SOMENTE SE SUA COLEÇÃO TIVER OUTRO NOME
    const convidadosRef = collection(db, "confirmacoes");

    let convidados = [];
    let filtroAtual = "todos";

    const guestList = document.getElementById("guestList");
    const searchInput = document.getElementById("searchInput");
    const tabs = document.querySelectorAll(".tab");
    const reportBtn = document.getElementById("reportBtn");
const shareWhatsappBtn = document.getElementById("shareWhatsappBtn");
    const reportModal = document.getElementById("reportModal");
const closeReportModal = document.getElementById("closeReportModal");

reportBtn.addEventListener("click", () => {
  const confirmados = convidados.filter(
    convidado => convidado.status === "confirmado"
  );

  const presentes = confirmados.filter(
    convidado => convidado.presente === true
  );

  const ausentes = confirmados.filter(
    convidado => convidado.presente !== true
  );

  const taxaComparecimento =
    confirmados.length > 0
      ? Math.round((presentes.length / confirmados.length) * 100)
      : 0;

  document.getElementById("modalConfirmedCount").textContent =
    confirmados.length;

  document.getElementById("modalPresentCount").textContent =
    presentes.length;

  document.getElementById("modalAbsentCount").textContent =
    ausentes.length;

  document.getElementById("modalAttendanceRate").textContent =
    `${taxaComparecimento}%`;

  reportModal.classList.add("open");
});
closeReportModal.addEventListener("click", () => {
    reportModal.classList.remove("open");
});

reportModal.addEventListener("click", (e) => {
    if (e.target === reportModal) {
        reportModal.classList.remove("open");
    }
});

    onSnapshot(convidadosRef, (snapshot) => {
      convidados = snapshot.docs.map((documento) => ({
  id: documento.id,
  nome: documento.data().nome,
  status: documento.data().status,
  dataHora: documento.data().dataHora,
  presente: documento.data().presente || false,
  horarioPresenca: documento.data().horarioPresenca || null
}));
      render();
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        filtroAtual = tab.dataset.filter;
        render();
      });
    });

    searchInput.addEventListener("input", render);

    function render() {
      const termo = searchInput.value.toLowerCase().trim();

      const filtrados = convidados.filter((convidado) => {
        const nome = (convidado.nome || "").toLowerCase();
        const confirmado = convidado.status === "confirmado";
        const presente = Boolean(convidado.presente);

        const bateBusca = nome.includes(termo);
        const bateFiltro =
          filtroAtual === "todos" ||
          (filtroAtual === "confirmados" && confirmado) ||
          (filtroAtual === "presentes" && presente) ||
          (filtroAtual === "pendentes" && !confirmado);

        return bateBusca && bateFiltro;
      });

      document.getElementById("totalCount").textContent = convidados.length;
      document.getElementById("confirmedCount").textContent =
 convidados.filter(c => c.status === "confirmado").length;
      document.getElementById("presentCount").textContent = convidados.filter(c => c.presente || c.present).length;

      if (filtrados.length === 0) {
        guestList.innerHTML = `<div class="empty">Nenhum convidado encontrado.</div>`;
        return;
      }

      guestList.innerHTML = filtrados
        .sort((a, b) => (a.nome || a.name || "").localeCompare(b.nome || b.name || ""))
        .map((convidado) => {
          const nome = convidado.nome || "Convidado sem nome";
          const confirmado = convidado.status === "confirmado";
          const presente = Boolean(convidado.presente || convidado.present);
          const horario = formatarHorario(convidado.horarioPresenca || convidado.presentAt);

          return `
            <article class="guest-card">
              <div>
                <div class="guest-name">${escapeHtml(nome)}</div>
                <div class="guest-status">${confirmado ? "Confirmado" : "Pendente de confirmação"}</div>
                ${presente ? `<div class="guest-time">Entrada registrada ${horario}</div>` : ""}
              </div>
              <button class="present-btn ${presente ? "off" : ""}" onclick="marcarPresenca('${convidado.id}', ${presente})">
                ${presente ? "PRESENTE ✓" : "MARCAR"}
              </button>
            </article>
          `;
        })
        .join("");
    }

    window.marcarPresenca = async function(id, jaPresente) {
     const convidadoDoc = doc(db, "confirmacoes", id);
      await updateDoc(convidadoDoc, {
        presente: !jaPresente,
        horarioPresenca: !jaPresente ? serverTimestamp() : null
      });
    };

    function formatarHorario(timestamp) {
      if (!timestamp) return "";
      const data = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return `às ${data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
    }

    function escapeHtml(texto) {
      return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
